<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resort Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <include src="navbar.html"></include>
    
    <!-- Hero Section -->
    <header class="resort-hero position-relative d-flex align-items-center justify-content-center text-center">
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50 z-1"></div>
        <div class="container position-relative z-2">
            <h1 class="display-2 fw-medium text-white mb-3" style="font-family: 'Playfair Display', serif; letter-spacing: 2px;">Welcome to Rio</h1>
            <p class="text-white-50 fs-5 mb-0">Discover the ultimate luxury experience</p>
        </div>
    </header>

    <!-- Overlapping Search/Booking Widget -->
        <div class="container position-absolute" style="bottom: -50px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <div class="bg-white p-4 p-md-5 shadow-lg w-100 mx-auto" style="max-width: 1000px;">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase fw-bold mb-1" style="font-size: 0.75rem; letter-spacing: 1px;">Check In</label>
                        <div class="input-group rounded-0 border-bottom border-dark border-opacity-10 pb-2">
                            <span class="input-group-text bg-white border-0 text-muted px-0"><i class="bi bi-calendar"></i></span>
                            <input type="text" class="form-control border-0 shadow-none bg-white text-dark ps-2" placeholder="DD MM YYYY">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted small text-uppercase fw-bold mb-1" style="font-size: 0.75rem; letter-spacing: 1px;">Check Out</label>
                        <div class="input-group rounded-0 border-bottom border-dark border-opacity-10 pb-2">
                            <span class="input-group-text bg-white border-0 text-muted px-0"><i class="bi bi-calendar"></i></span>
                            <input type="text" class="form-control border-0 shadow-none bg-white text-dark ps-2" placeholder="DD MM YYYY">
                        </div>
                    </div>
                    
                    <include src="searchbar.html"></include>

                    <div class="col-md-2">
                        <button class="btn btn-info rounded-0 w-100 text-white fw-bold py-3 text-uppercase" style="letter-spacing: 1px; font-size: 0.85rem;" type="button">Book</button>
                    </div>
                </div>
            </div>
        </div>

    <!-- Main Content -->
    <main class="container py-5 mt-5">
        <slot></slot>
    </main>

    <include src="footer.html"></include>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
