<div class="col-md-4 harkawal-search-wrapper">
    <label class="form-label text-muted small text-uppercase fw-bold mb-1" style="font-size: 0.75rem; letter-spacing: 1px;">Search Site</label>
    <div class="input-group rounded-0 border-bottom border-dark border-opacity-10 pb-2 position-relative">
        <input type="text" id="hk-search-input" class="form-control border-0 shadow-none bg-white text-dark px-0" placeholder="Search keywords..." autocomplete="off">
        <div id="hk-search-results" class="list-group position-absolute w-100 shadow-lg" style="top: 100%; left: 0; z-index: 2000; display: none;"></div>
    </div>
</div>
<script src="/search-data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById('hk-search-input');
    const results = document.getElementById('hk-search-results');
    if(input) {
        input.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            results.innerHTML = '';
            if (query.length < 2) { results.style.display = 'none'; return; }
            if(window.hkSearchData) {
                const filtered = window.hkSearchData.filter(i => i.title.toLowerCase().includes(query) || i.content.toLowerCase().includes(query));
                if (filtered.length > 0) {
                    results.style.display = 'block';
                    filtered.slice(0, 5).forEach(item => {
                        const a = document.createElement('a'); a.href = item.url; a.className = 'list-group-item list-group-item-action border-0 border-bottom rounded-0 py-3'; a.innerHTML = `<strong>${item.title}</strong>`; results.appendChild(a);
                    });
                } else {
                    results.style.display = 'block'; results.innerHTML = '<div class="list-group-item text-muted rounded-0 border-0 py-3">No results found</div>';
                }
            }
        });
        document.addEventListener('click', (e) => { if (!e.target.closest('.harkawal-search-wrapper')) results.style.display = 'none'; });
    }
});
</script>
